[project]
name = "fincoach"
version = "0.2.0"
description = "Financial workflow automation for accountants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
