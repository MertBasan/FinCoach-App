{% extends "base.html" %}
{% block title %}Register · FinCoach{% endblock %}
{% block content %}
<div class="form-card auth-card-wrap">
    <h1>Register your firm</h1>
    <p class="muted">You'll be set up as the firm owner.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
        <label class="field">
            <span class="field-label">Firm name</span>
            <input type="text" name="firm_name" required autofocus placeholder="Anderson & Co">
        </label>
        <label class="field">
            <span class="field-label">Your name</span>
            <input type="text" name="name" required>
        </label>
        <label class="field">
            <span class="field-label">Email</span>
            <input type="email" name="email" required>
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <input type="password" name="password" required minlength="8">
        </label>
        <button type="submit" class="button">Create firm</button>
    </form>
    <p class="auth-footer">Already registered? <a href="/login">Sign in</a>.</p>
</div>
{% endblock %}
