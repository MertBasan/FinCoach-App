{% extends "base.html" %}
{% block title %}Mali Asistan — FinCoach{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Mali Asistan</h1>
    <p style="color:#666;margin-top:0.25rem;">Finansal verileriniz hakkında soru sorun.</p>
</div>

{% if assistant_enabled %}
<div class="card" style="display:flex;flex-direction:column;height:60vh;min-height:360px;max-width:720px;">
    <div id="chat-area" style="flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.75rem;">
    </div>
    <div style="border-top:1px solid #e5e7eb;padding:0.75rem 1rem;">
        <form
            hx-post="/portal/assistant/ask"
            hx-target="#chat-area"
            hx-swap="beforeend"
            hx-on::after-request="this.reset(); document.getElementById('chat-area').scrollTop = 9999;"
            style="display:flex;gap:0.5rem;"
        >
            <input
                type="text"
                name="question"
                placeholder="Sorunuzu yazın... (örn: Bu ay en büyük giderim neydi?)"
                required
                maxlength="500"
                style="flex:1;padding:0.5rem 0.75rem;border:1px solid #d1d5db;border-radius:6px;font-size:0.95rem;"
            >
            <button type="submit" class="btn" style="white-space:nowrap;">Sor</button>
        </form>
    </div>
</div>

<style>
.chat-pair { display: flex; flex-direction: column; gap: 0.4rem; }
.chat-bubble { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
.chat-bubble.user { align-self: flex-end; background: #dbeafe; color: #1e3a5f; border-bottom-right-radius: 3px; }
.chat-bubble.assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; color: #111; border-bottom-left-radius: 3px; }
</style>

{% else %}
<div class="card" style="padding:2rem;max-width:480px;color:#666;">
    <p>Asistan henüz yapılandırılmamış.</p>
</div>
{% endif %}
{% endblock %}
