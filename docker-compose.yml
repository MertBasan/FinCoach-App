services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincoach}
      POSTGRES_USER: ${POSTGRES_USER:-fincoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincoach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fincoach}
      POSTGRES_USER: ${POSTGRES_USER:-fincoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_me}
      ENVIRONMENT: development
      UPLOAD_DIR: /code/uploaded_files
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./scripts:/code/scripts
      - uploads:/code/uploaded_files
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  uploads:
