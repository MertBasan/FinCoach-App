services:
  n8n:
    image: n8nio/n8n
    container_name: fincoach-n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=yourpassword
      - GENERIC_TIMEZONE=Europe/London
    restart: unless-stopped